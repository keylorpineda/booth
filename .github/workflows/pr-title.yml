name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # Work PRs are squash-merged, so the PR title becomes the commit message.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            web
            shared
            db
            auth
            catalog
            orders
            storefront
            dashboard
            i18n
            ui
            deps
            deps-dev
            ci
            repo
            release
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: 'The subject "{subject}" must start lowercase and not end with a period.'
