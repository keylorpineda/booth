name: Feature request
description: Propose a new feature or an improvement
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which store owner or customer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Target milestone
      options:
        - MVP
        - v1.1
        - Backlog
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
