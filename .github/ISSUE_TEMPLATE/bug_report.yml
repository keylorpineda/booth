name: Bug report
description: Something does not work as expected
labels: ['type: bug', 'status: triage']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /s/demo-bakery
        2. Add a product to the cart
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storefront (web)
        - Owner dashboard (web)
        - API
        - Shared package
        - CI / deployment
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'e.g. Android Chrome 140, iPhone Safari 26, local dev'
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
