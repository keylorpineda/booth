<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b17" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Booth: catálogo en línea y pedidos por WhatsApp para pequeños negocios."
    />
    <title>Booth</title>
    <script>
      // Applies the saved light/dark choice before first paint (no flash). See lib/color-scheme.ts.
      try {
        var theme = localStorage.getItem('booth.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <script>
      // Starts the storefront API requests while the JS bundle downloads, so the first paint of a
      // store does not wait for "download JS, then fetch data". Consumed once by lib/prefetch.ts.
      (function () {
        var host = location.hostname.toLowerCase();
        var pathname = location.pathname;
        var slug = null;
        var isStoreDomain = false;

        var match = pathname.match(/^\/s\/([^/]+)\/?$/);
        if (match) {
          slug = decodeURIComponent(match[1]);
        } else if (pathname === '/' || pathname === '') {
          if (host.endsWith('.localhost')) {
            var sub = host.slice(0, -'.localhost'.length);
            if (
              sub &&
              !sub.includes('.') &&
              sub !== 'api' &&
              sub !== 'app' &&
              sub !== 'admin' &&
              sub !== 'www'
            ) {
              slug = sub;
              isStoreDomain = true;
            }
          } else if (host.endsWith('.booth.app')) {
            var sub = host.slice(0, -'.booth.app'.length);
            if (
              sub &&
              !sub.includes('.') &&
              sub !== 'api' &&
              sub !== 'app' &&
              sub !== 'admin' &&
              sub !== 'www'
            ) {
              slug = sub;
              isStoreDomain = true;
            }
          } else if (host !== 'localhost' && host !== '127.0.0.1' && host !== 'booth.app') {
            isStoreDomain = true;
          }
        }

        if (!slug && !isStoreDomain) return;

        var base = slug
          ? '/api/public/stores/' + encodeURIComponent(slug)
          : '/api/public/storefront';
        var get = function (url) {
          var request = fetch(url, { credentials: 'include' }).then(function (response) {
            return response.ok ? response.json() : Promise.reject(response.status);
          });
          request.catch(function () {});
          return request;
        };
        window.__BOOTH_PREFETCH__ = {
          slug: slug || '',
          store: get(base),
          catalog: get(base + '/catalog'),
        };
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static placeholder painted before the app loads; React replaces it on mount. -->
      <div class="min-h-dvh">
        <div class="h-40 bg-surface-sunken sm:h-56"></div>
        <div class="mx-auto max-w-5xl px-4">
          <div class="-mt-10 size-20 rounded-card border-4 border-surface bg-surface-sunken"></div>
          <p class="mt-3 text-2xl font-extrabold tracking-tight text-ink-subtle">Booth</p>
          <div class="mt-2 h-4 w-1/2 max-w-xs rounded-control bg-surface-sunken"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
