<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Booth: your online catalog, orders through WhatsApp">
<style>
  text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .scene{opacity:0;animation:12s linear infinite}
  .s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
  @keyframes s1{0%{opacity:0}2%,23%{opacity:1}25%,100%{opacity:0}}@keyframes s2{0%,25%{opacity:0}27%,48%{opacity:1}50%,100%{opacity:0}}@keyframes s3{0%,50%{opacity:0}52%,73%{opacity:1}75%,100%{opacity:0}}@keyframes s4{0%,75%{opacity:0}77%,98%{opacity:1}100%{opacity:0}}
  .pill rect{fill:#F6F6FA;stroke:#E6E6EF;animation:12s linear infinite}
  .pill text{fill:#5B5B73;animation:12s linear infinite}
  .p1 rect{animation-name:r1}.p2 rect{animation-name:r2}.p3 rect{animation-name:r3}.p4 rect{animation-name:r4}
  .p1 text{animation-name:t1}.p2 text{animation-name:t2}.p3 text{animation-name:t3}.p4 text{animation-name:t4}
  @keyframes r1{0%,24%{fill:#4F46E5;stroke:#4F46E5}25%,99%{fill:#F6F6FA;stroke:#E6E6EF}100%{fill:#4F46E5;stroke:#4F46E5}}@keyframes t1{0%,24%{fill:#FFFFFF}25%,99%{fill:#5B5B73}100%{fill:#FFFFFF}}@keyframes r2{0%,25%{fill:#F6F6FA;stroke:#E6E6EF}26%,49%{fill:#4F46E5;stroke:#4F46E5}50%,100%{fill:#F6F6FA;stroke:#E6E6EF}}@keyframes t2{0%,25%{fill:#5B5B73}26%,49%{fill:#FFFFFF}50%,100%{fill:#5B5B73}}@keyframes r3{0%,50%{fill:#F6F6FA;stroke:#E6E6EF}51%,74%{fill:#4F46E5;stroke:#4F46E5}75%,100%{fill:#F6F6FA;stroke:#E6E6EF}}@keyframes t3{0%,50%{fill:#5B5B73}51%,74%{fill:#FFFFFF}75%,100%{fill:#5B5B73}}@keyframes r4{0%,75%{fill:#F6F6FA;stroke:#E6E6EF}76%,99%{fill:#4F46E5;stroke:#4F46E5}100%,100%{fill:#F6F6FA;stroke:#E6E6EF}}@keyframes t4{0%,75%{fill:#5B5B73}76%,99%{fill:#FFFFFF}100%,100%{fill:#5B5B73}}
  .tap{transform-box:fill-box;transform-origin:center;animation:tap 12s ease-out infinite}
  @keyframes tap{0%,8%{transform:scale(1)}10%{transform:scale(.8)}13%,100%{transform:scale(1)}}
  .cart{animation:cart 12s ease-out infinite}
  @keyframes cart{0%,10%{transform:translateY(70px)}14%,100%{transform:translateY(0)}}
  .bubble{transform-box:fill-box;transform-origin:right bottom;animation:bubble 12s ease-out infinite}
  @keyframes bubble{0%,26%{transform:scale(.7);opacity:0}30%,100%{transform:scale(1);opacity:1}}
  .ticks{animation:ticks 12s linear infinite}
  @keyframes ticks{0%,35%{opacity:0}37%,100%{opacity:1}}
  .check{stroke-dasharray:48;animation:check 12s ease-out infinite}
  @keyframes check{0%,57%{stroke-dashoffset:48}62%,100%{stroke-dashoffset:0}}
  .verdict{animation:verdict 12s linear infinite}
  @keyframes verdict{0%,61%{opacity:0}64%,100%{opacity:1}}
  .progress{transform-box:fill-box;transform-origin:top;animation:progress 12s ease-in-out infinite}
  @keyframes progress{0%,79%{transform:scaleY(0)}90%,100%{transform:scaleY(1)}}
  .d2{animation:d2 12s linear infinite}@keyframes d2{0%,83%{fill:#D3D3E0}84%,100%{fill:#4F46E5}}
  .d3{animation:d3 12s linear infinite}@keyframes d3{0%,89%{fill:#D3D3E0}90%,100%{fill:#16865A}}
  .ready{transform-box:fill-box;transform-origin:center;animation:ready 12s ease-out infinite}
  @keyframes ready{0%,89%{transform:scale(.6);opacity:0}93%,100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .s1{opacity:1}.p1 rect{fill:#4F46E5;stroke:#4F46E5}.p1 text{fill:#FFFFFF}
  }
</style>
