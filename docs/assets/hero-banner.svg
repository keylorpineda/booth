<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>

    <!-- Radial Glow 1 (Indigo) -->
    <radialGradient id="glowIndigo" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <!-- Radial Glow 2 (Amber / Terracotta) -->
    <radialGradient id="glowAmber" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#E85D3A" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#E85D3A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#E85D3A" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E85D3A" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }
      .floating-logo {
        animation: floatAnim 4s ease-in-out infinite;
      }
      .glowing-bg {
        animation: pulseLight 6s ease-in-out infinite;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -1.5px;
        fill: #FFFFFF;
      }
      .brand-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        letter-spacing: -0.2px;
        fill: #94A3B8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #CBD5E1;
      }
      .version-tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        fill: #A5B4FC;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowIndigo)" class="glowing-bg"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowAmber)"/>

  <!-- Outer Modern Subtle Border -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Top Decorative Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Hero Content Center Group -->
  <g transform="translate(600, 0)" text-anchor="middle">
    
    <!-- Floating Logo Badge -->
    <g class="floating-logo" transform="translate(0, 75)">
      <!-- Ambient Shadow -->
      <circle cx="0" cy="10" r="42" fill="#4F46E5" opacity="0.4" filter="url(#subtleShadow)"/>
      <!-- Icon Container -->
      <rect x="-38" y="-38" width="76" height="76" rx="20" fill="url(#logoGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
      
      <!-- Booth Canopy Vector Icon -->
      <g transform="translate(-24, -24) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Awning Roof -->
        <path d="M3 9l2.5-5h13l2.5 5" fill="rgba(255,255,255,0.2)"/>
        <!-- Awning Scallops -->
        <path d="M3 9c0 1.66 1.34 3 3 3s3-1.34 3-3c0 1.66 1.34 3 3 3s3-1.34 3-3c0 1.66 1.34 3 3 3s3-1.34 3-3"/>
        <!-- Base / Counter -->
        <path d="M5 12v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/>
        <!-- Shelf detail -->
        <line x1="5" y1="16" x2="19" y2="16"/>
      </g>
    </g>

    <!-- Version Pill -->
    <g transform="translate(0, 162)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#312E81" fill-opacity="0.6" stroke="#6366F1" stroke-width="1.2"/>
      <text y="4" class="version-tag">OPEN SOURCE COMMERCE</text>
    </g>

    <!-- Title -->
    <text y="228" class="brand-title">Booth</text>

    <!-- Tagline -->
    <text y="270" class="brand-tagline">
      The modern, commission-free digital catalog and WhatsApp commerce platform
    </text>
    <text y="296" class="brand-tagline" font-size="16px" fill="#64748B">
      Built for artisan bakeries, specialty coffee, local makers and independent merchants
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 348)">
      <!-- Badge 1: 0% Commissions -->
      <g transform="translate(-400, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <!-- Percent / Cash Icon -->
        <circle cx="-60" cy="0" r="8" fill="#10B981" fill-opacity="0.2"/>
        <path d="M-63 -3l6 6M-63 3l.01 0M-57 -3l.01 0" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
        <text x="-44" y="5" text-anchor="start" class="pill-text">0% Commissions</text>
      </g>

      <!-- Badge 2: Gemini Vision AI -->
      <g transform="translate(-200, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#pillBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <!-- Sparkle AI Icon -->
        <circle cx="-70" cy="0" r="8" fill="#8B5CF6" fill-opacity="0.2"/>
        <path d="M-70 -5v10M-75 0h10M-73 -3l6 6M-73 3l6 -6" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
        <text x="-52" y="5" text-anchor="start" class="pill-text">Gemini AI OCR</text>
      </g>

      <!-- Badge 3: WhatsApp 1-Click -->
      <g transform="translate(0, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="url(#pillBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <!-- Chat Bubble Icon -->
        <circle cx="-65" cy="0" r="8" fill="#25D366" fill-opacity="0.2"/>
        <path d="M-67 -3h4a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3h-2l-3 2v-2a3 3 0 0 1-1-2v-2a3 3 0 0 1 3-3z" stroke="#25D366" stroke-width="1.4" fill="none"/>
        <text x="-48" y="5" text-anchor="start" class="pill-text">WhatsApp Flow</text>
      </g>

      <!-- Badge 4: Multi-Tenant Domains -->
      <g transform="translate(200, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="url(#pillBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <!-- Globe / Domain Icon -->
        <circle cx="-65" cy="0" r="8" fill="#38BDF8" fill-opacity="0.2"/>
        <circle cx="-65" cy="0" r="5" stroke="#38BDF8" stroke-width="1.3" fill="none"/>
        <ellipse cx="-65" cy="0" rx="2" ry="5" stroke="#38BDF8" stroke-width="1.2" fill="none"/>
        <text x="-48" y="5" text-anchor="start" class="pill-text">Custom Domains</text>
      </g>

      <!-- Badge 5: Full Stack Monorepo -->
      <g transform="translate(390, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="url(#pillBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <!-- Layers Icon -->
        <circle cx="-56" cy="0" r="8" fill="#F59E0B" fill-opacity="0.2"/>
        <path d="M-61 -2l5-3 5 3-5 3-5-3zM-61 1l5 3 5-3M-61 4l5 3 5-3" stroke="#FBBF24" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="-40" y="5" text-anchor="start" class="pill-text">NestJS + React</text>
      </g>
    </g>
  </g>
</svg>
