<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Highlighted AI Card Background -->
    <linearGradient id="cardAiBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#130D2E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Animated Flow Gradient for Connectors -->
    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#25D366"/>
      <stop offset="75%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .connector-stream {
        stroke-dasharray: 8 6;
        animation: dashFlow 1.2s linear infinite;
      }
      .flow-card {
        transition: transform 0.3s ease;
      }
      .step-num {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
      }
      .card-body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11.5px;
        line-height: 16px;
        fill: #94A3B8;
      }
      .header-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        fill: #6366F1;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="370" rx="16" fill="url(#flowBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Flow Header Label -->
  <g transform="translate(60, 42)">
    <text class="header-title">CUSTOMER ORDER TO FULFILLMENT LIFECYCLE</text>
  </g>

  <!-- Continuous Animated Connector Path -->
  <path d="M170 190 L395 190 L620 190 L845 190 L1070 190" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 190 L395 190 L620 190 L845 190 L1070 190" fill="none" stroke="url(#flowLineGrad)" stroke-width="3" stroke-linecap="round" class="connector-stream"/>

  <!-- ==================== STEP 1: STOREFRONT ==================== -->
  <g transform="translate(60, 75)" class="flow-card">
    <rect width="210" height="235" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Step Tag -->
    <rect x="14" y="14" width="60" height="20" rx="10" fill="#312E81" stroke="#4F46E5" stroke-width="1"/>
    <text x="44" y="28" text-anchor="middle" fill="#A5B4FC" class="step-num">STEP 01</text>
    
    <!-- Icon Circle -->
    <circle cx="170" cy="24" r="14" fill="#4F46E5" fill-opacity="0.2"/>
    <!-- Canopy Icon -->
    <g transform="translate(162, 16) scale(0.8)" stroke="#818CF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 7l2-4h12l2 4M2 7v10h16V7"/>
      <path d="M2 7c0 1.5 1 2.5 2 2.5s2-1 2-2.5c0 1.5 1 2.5 2 2.5s2-1 2-2.5c0 1.5 1 2.5 2 2.5s2-1 2-2.5"/>
    </g>

    <text x="14" y="65" class="card-title">Digital Storefront</text>
    <text x="14" y="83" class="card-sub" fill="#38BDF8">Mobile-First SPA</text>
    
    <g transform="translate(14, 108)" class="card-body">
      <text y="0">• Zero app installation</text>
      <text y="20">• Custom brand domain</text>
      <text y="40">• Subdomain tenant URL</text>
      <text y="60">• Visual catalog &amp; photos</text>
      <text y="80">• Real-time open hours</text>
      <text y="100">• Regional currencies</text>
    </g>
  </g>

  <!-- ==================== STEP 2: SMART CART ==================== -->
  <g transform="translate(285, 75)" class="flow-card">
    <rect width="210" height="235" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Step Tag -->
    <rect x="14" y="14" width="60" height="20" rx="10" fill="#065F46" stroke="#059669" stroke-width="1"/>
    <text x="44" y="28" text-anchor="middle" fill="#6EE7B7" class="step-num">STEP 02</text>
    
    <!-- Icon Circle -->
    <circle cx="170" cy="24" r="14" fill="#10B981" fill-opacity="0.2"/>
    <!-- Cart Icon -->
    <g transform="translate(162, 16) scale(0.8)" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="18" r="2"/>
      <circle cx="16" cy="18" r="2"/>
      <path d="M2 3h3l2.5 10h10l2-7H6"/>
    </g>

    <text x="14" y="65" class="card-title">Smart Cart</text>
    <text x="14" y="83" class="card-sub" fill="#34D399">Options &amp; Stock</text>
    
    <g transform="translate(14, 108)" class="card-body">
      <text y="0">• Product variants &amp; sizes</text>
      <text y="20">• Add-ons &amp; modifiers</text>
      <text y="40">• Dynamic server pricing</text>
      <text y="60">• Delivery zone fees</text>
      <text y="80">• Temporary stock hold</text>
      <text y="100">• Automatic cart TTL</text>
    </g>
  </g>

  <!-- ==================== STEP 3: 1-CLICK WHATSAPP ==================== -->
  <g transform="translate(510, 75)" class="flow-card">
    <rect width="210" height="235" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Step Tag -->
    <rect x="14" y="14" width="60" height="20" rx="10" fill="#064E3B" stroke="#25D366" stroke-width="1"/>
    <text x="44" y="28" text-anchor="middle" fill="#86EFAC" class="step-num">STEP 03</text>
    
    <!-- Icon Circle -->
    <circle cx="170" cy="24" r="14" fill="#25D366" fill-opacity="0.2"/>
    <!-- WhatsApp Icon -->
    <g transform="translate(162, 16) scale(0.8)" stroke="#25D366" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10.5a8.5 8.5 0 0 1-13 7.3L3 19l1.3-3.8A8.5 8.5 0 1 1 20 10.5z"/>
    </g>

    <text x="14" y="65" class="card-title">WhatsApp Order</text>
    <text x="14" y="83" class="card-sub" fill="#25D366">1-Click Dispatch</text>
    
    <g transform="translate(14, 108)" class="card-body">
      <text y="0">• Pre-saved PENDING order</text>
      <text y="20">• Unique code (#PLE-8492)</text>
      <text y="40">• Formatted itemized copy</text>
      <text y="60">• Delivery address/notes</text>
      <text y="80">• Direct wa.me link</text>
      <text y="100">• Private tracking URL</text>
    </g>
  </g>

  <!-- ==================== STEP 4: GEMINI VISION AI ==================== -->
  <g transform="translate(735, 75)" class="flow-card">
    <rect width="210" height="235" rx="12" fill="url(#cardAiBg)" stroke="#8B5CF6" stroke-width="1.6" filter="url(#cardShadow)"/>
    <!-- Top Step Tag -->
    <rect x="14" y="14" width="60" height="20" rx="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="44" y="28" text-anchor="middle" fill="#C4B5FD" class="step-num">STEP 04</text>
    
    <!-- Icon Circle -->
    <circle cx="170" cy="24" r="14" fill="#8B5CF6" fill-opacity="0.3"/>
    <!-- AI Sparkle Icon -->
    <g transform="translate(162, 16) scale(0.8)" stroke="#C4B5FD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2v16M2 10h16M4 4l12 12M4 16L16 4"/>
    </g>

    <text x="14" y="65" class="card-title">Gemini Vision AI</text>
    <text x="14" y="83" class="card-sub" fill="#A78BFA">Automated OCR</text>
    
    <g transform="translate(14, 108)" class="card-body">
      <text y="0" fill="#E2E8F0">• Customer uploads receipt</text>
      <text y="20" fill="#E2E8F0">• Multimodal OCR analysis</text>
      <text y="40" fill="#E2E8F0">• Amount cross-check</text>
      <text y="60" fill="#E2E8F0">• SINPE/SPEI/Pix match</text>
      <text y="80" fill="#E2E8F0">• Duplicate voucher check</text>
      <text y="100" fill="#38BDF8">• 100% Auto-Approval</text>
    </g>
  </g>

  <!-- ==================== STEP 5: REAL-TIME TRACKING ==================== -->
  <g transform="translate(960, 75)" class="flow-card">
    <rect width="210" height="235" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Step Tag -->
    <rect x="14" y="14" width="60" height="20" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="44" y="28" text-anchor="middle" fill="#94A3B8" class="step-num">STEP 05</text>
    
    <!-- Icon Circle -->
    <circle cx="170" cy="24" r="14" fill="#38BDF8" fill-opacity="0.2"/>
    <!-- Check Circle Icon -->
    <g transform="translate(162, 16) scale(0.8)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="9"/>
      <path d="M6 10l3 3 6-6"/>
    </g>

    <text x="14" y="65" class="card-title">Live Fulfillment</text>
    <text x="14" y="83" class="card-sub" fill="#38BDF8">Real-Time Tracking</text>
    
    <g transform="translate(14, 108)" class="card-body">
      <text y="0">• Kitchen orders dashboard</text>
      <text y="20">• Staff roles &amp; permissions</text>
      <text y="40">• Live customer timeline</text>
      <text y="60">• Zero app needed for tracking</text>
      <text y="80">• Permanent order history</text>
      <text y="100">• Pickup &amp; delivery routing</text>
    </g>
  </g>
</svg>
